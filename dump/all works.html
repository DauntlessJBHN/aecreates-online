<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Banner Gallery with Smooth Transitions</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #ff3366;
            --transition: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Banner Gallery Section */
        .banner-gallery-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .gallery-header h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 30%, #777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gallery-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Category Filter Bar */
        .filter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 3rem;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s var(--transition);
        }

        .filter-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border-color: var(--text-primary);
            font-weight: 600;
        }

        /* Equal Size Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 1300px;
        }

        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Cool Transition Animation Setup for Grid Items */
        .gallery-item {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            height: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            /* Transition properties for smooth filtering */
            opacity: 1;
            transform: scale(1);
            visibility: visible;
            transition: opacity 0.5s var(--transition), 
                        transform 0.5s var(--transition), 
                        visibility 0.5s var(--transition), 
                        box-shadow 0.4s var(--transition);
        }

        /* State when an item is filtered out */
        .gallery-item.hide {
            opacity: 0;
            transform: scale(0.85);
            visibility: hidden;
            pointer-events: none;
            /* Collapse height/margins seamlessly if preferred, 
               or let it absolute fade out. Using absolute positioning tricks 
               or simple scale/opacity works best with CSS grids. */
            position: absolute;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s var(--transition), filter 0.5s ease;
        }

        /* Overlay details on hover */
        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s var(--transition), transform 0.4s var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
            filter: brightness(0.9);
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item:hover {
            box-shadow: 0 20px 40px rgba(255, 51, 102, 0.15);
        }

        .project-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        /* Lightbox Modal Component with Smooth Pop-in */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 2rem;
            backdrop-filter: blur(8px);
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s var(--transition);
        }

        .lightbox-modal.active .lightbox-content {
            transform: scale(1) translateY(0);
        }

        .lightbox-image-container {
            width: 100%;
            height: 450px;
            overflow: hidden;
        }

        .lightbox-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lightbox-details {
            padding: 2rem;
        }

        .lightbox-details h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .lightbox-details p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
            z-index: 10;
        }

        .close-btn:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .view-project-btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--text-primary);
            color: var(--bg-color);
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s, transform 0.2s;
        }

        .view-project-btn:hover {
            background: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>

    <section class="banner-gallery-section">
        <div class="gallery-header">
            <h1>Featured Works</h1>
            <p>Selected brand identities, visual systems, and creative design initiatives.</p>
        </div>

        <!-- Category Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All Works</button>
            <button class="filter-btn" data-filter="visual-design">Visual Design</button>
            <button class="filter-btn" data-filter="product-styling">Product Styling</button>
            <button class="filter-btn" data-filter="digital-media">Digital Media</button>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery-grid">
            <!-- Item 1 -->
            <div class="gallery-item" 
                 data-category="visual-design"
                 data-title="Brand Identity System" 
                 data-desc-category="Visual Design & Branding" 
                 data-description="A comprehensive corporate identity project featuring modern typography systems, dynamic packaging, and high-impact visual layouts."
                 data-img="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" alt="Brand Identity">
                <div class="gallery-overlay">
                    <span class="project-category">Visual Design</span>
                    <h3 class="project-title">Brand Identity System</h3>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="gallery-item" 
                 data-category="product-styling"
                 data-title="Artisan Packaging & Labeling" 
                 data-desc-category="Product Styling" 
                 data-description="Custom aesthetic merchandise and product label design tailored for upscale consumer goods and artisan markets."
                 data-img="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop" alt="Packaging">
                <div class="gallery-overlay">
                    <span class="project-category">Product Styling</span>
                    <h3 class="project-title">Artisan Packaging</h3>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="gallery-item" 
                 data-category="digital-media"
                 data-title="Digital Experience & UI Kit" 
                 data-desc-category="Digital Media" 
                 data-description="Futuristic layout concepts and digital UI branding assets designed for modern interactive web platforms."
                 data-img="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop" alt="Digital Experience">
                <div class="gallery-overlay">
                    <span class="project-category">Digital Media</span>
                    <h3 class="project-title">Digital Experience</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal Component -->
    <div class="lightbox-modal" id="lightboxModal">
        <div class="lightbox-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <div class="lightbox-image-container">
                <img id="modalImg" src="" alt="Project Preview">
            </div>
            <div class="lightbox-details">
                <span class="project-category" id="modalCategory" style="display:block; margin-bottom:0.4rem;">Category</span>
                <h2 id="modalTitle">Project Title</h2>
                <p id="modalDesc">Detailed project description goes here.</p>
                <a href="#" class="view-project-btn" id="modalLink">Explore Full Case Study</a>
            </div>
        </div>
    </div>

    <script>
        // Smooth Filtering Logic
        const filterBtns = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');

                galleryItems.forEach(item => {
                    const itemCategory = item.getAttribute('data-category');
                    if (filterValue === 'all' || itemCategory === filterValue) {
                        item.classList.remove('hide');
                    } else {
                        item.classList.add('hide');
                    }
                });
            });
        });

        // Lightbox Logic
        const modal = document.getElementById('lightboxModal');
        const closeModal = document.getElementById('closeModal');
        
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalCategory = document.getElementById('modalCategory');
        const modalDesc = document.getElementById('modalDesc');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                // Prevent click processing if hidden
                if (item.classList.contains('hide')) return;

                const title = item.getAttribute('data-title');
                const category = item.getAttribute('data-desc-category');
                const desc = item.getAttribute('data-description');
                const imgSrc = item.getAttribute('data-img');

                modalTitle.textContent = title;
                modalCategory.textContent = category;
                modalDesc.textContent = desc;
                modalImg.src = imgSrc;

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        const closeLightbox = () => {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        };

        closeModal.addEventListener('click', closeLightbox);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeLightbox();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
