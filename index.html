<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Interactive Website Banner</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #070913;
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Banner Container with Entrance Animation */
        .banner {
            position: relative;
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            background: linear-gradient(135deg, #161338 0%, #090d1a 100%);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            animation: bannerEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bannerEntrance {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Floating Gradient Orbs */
        .orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(99, 102, 241, 0) 70%);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 1;
            animation: floatOrb1 12s ease-in-out infinite alternate;
        }

        .orb-2 {
            top: auto;
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(236, 72, 153, 0) 70%);
            animation: floatOrb2 15s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 80px) scale(1.15); }
            100% { transform: translate(-30px, 40px) scale(0.9); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-80px, -60px) scale(1.2); }
            100% { transform: translate(40px, -30px) scale(0.95); }
        }

        /* Content Styling & Staggered Entrance */
        .banner-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.3s forwards;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.025em;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.5s forwards;
        }

        h1 span {
            background: linear-gradient(135deg, #818cf8 0%, #ec4899 50%, #f59e0b 100%);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.7s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Interactive Buttons */
        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease 0.9s forwards;
        }

        .btn {
            position: relative;
            padding: 0.875rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            outline: none;
            overflow: hidden;
        }

        .btn-primary {
            background: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px) scale(1.02);
        }

        /* Interactive Dynamic Mouse Spotlight */
        .interactive-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
            z-index: 1;
        }

        /* Floating Interactive Particle Elements */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: floatParticle 8s linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="banner" id="banner">
        <div class="orb"></div>
        <div class="orb orb-2"></div>
        <div class="interactive-glow" id="glow"></div>

        <div class="banner-content">
            <span class="badge">🚀 Introducing Version 2.0</span>
            <h1>Build Better Products <span>Faster Than Ever</span></h1>
            <p>Empower your workflow with next-generation tools designed for high-performing teams. Scale seamlessly and ship code with confidence.</p>
            
            <div class="cta-group">
                <button class="btn btn-primary" id="mainBtn">Get Started Free</button>
                <button class="btn btn-secondary" onclick="alert('Exploring features!')">View Documentation</button>
            </div>
        </div>
    </div>

    <script>
        // Mouse move interactive lighting spotlight
        const banner = document.getElementById('banner');
        const glow = document.getElementById('glow');

        banner.addEventListener('mousemove', (e) => {
            const rect = banner.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            glow.style.left = `${x}px`;
            glow.style.top = `${y}px`;
        });

        // Dynamic Floating Particles Generator
        function createParticles() {
            const particleCount = 15;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 6 + 2;
                const leftPos = Math.random() * 100;
                const animDuration = Math.random() * 5 + 5;
                const animDelay = Math.random() * 5;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${leftPos}%`;
                particle.style.animationDuration = `${animDuration}s`;
                particle.style.animationDelay = `${animDelay}s`;

                banner.appendChild(particle);
            }
        }
        createParticles();

        // Interactive Button Feedback Animation
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.addEventListener('click', () => {
            mainBtn.textContent = '🎉 Success! Redirecting...';
            mainBtn.style.background = '#10b981';
            mainBtn.style.boxShadow = '0 4px 20px rgba(16, 185, 129, 0.5)';
            
            setTimeout(() => {
                mainBtn.textContent = 'Get Started Free';
                mainBtn.style.background = '#6366f1';
                mainBtn.style.boxShadow = '0 4px 20px rgba(99, 102, 241, 0.4)';
            }, 3000);
        });
    </script>
</body>
</html>
