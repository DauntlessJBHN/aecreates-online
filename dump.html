<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroSugar Animation</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            background-image: 
                linear-gradient(to right, #ececec 1px, transparent 1px),
                linear-gradient(to bottom, #ececec 1px, transparent 1px);
            background-size: 24px 24px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Bounding Box Wrapper centered on screen */
        .bounding-box-wrapper {
            position: relative;
            display: inline-block;
            padding: 2.5rem 3.5rem;
            border: 2px solid #b0b0b0;
            background: #ffffff;
            transition: all 0.05s ease-out;
        }

        /* Small square control handles on the corners and edges */
        .handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border: 2px solid #888888;
        }

        /* Corner & Edge Handles */
        .handle-tl { top: -5px; left: -5px; }
        .handle-tc { top: -5px; left: calc(50% - 4px); }
        .handle-tr { top: -5px; right: -5px; }
        .handle-ml { top: calc(50% - 4px); left: -5px; }
        .handle-mr { top: calc(50% - 4px); right: -5px; }
        .handle-bl { bottom: -5px; left: -5px; }
        .handle-bc { bottom: -5px; left: calc(50% - 4px); }
        .handle-br { bottom: -5px; right: -5px; }

        /* Main Text Styling with Typing Animation Container */
        .tagline {
            font-size: clamp(3rem, 6vw, 5.5rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            color: #1c1c1c;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
        }

        .tagline span {
            color: #2cbae2;
        }

        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            background-color: #2cbae2;
            width: 5px;
            animation: blink 0.8s infinite;
            margin-left: 2px;
            vertical-align: bottom;
            height: 1em;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            50.1%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bounding-box-wrapper" id="boundingBox">
        <!-- Selection Handles -->
        <div class="handle handle-tl"></div>
        <div class="handle handle-tc"></div>
        <div class="handle handle-tr"></div>
        <div class="handle handle-ml"></div>
        <div class="handle handle-mr"></div>
        <div class="handle handle-bl"></div>
        <div class="handle handle-bc"></div>
        <div class="handle handle-br"></div>

        <h1 class="tagline" id="typedText"></h1><span class="cursor" id="cursor"></span>
    </div>

    <script>
        const textTarget = document.getElementById('typedText');
        const plainText = 'ZeroSugar';
        
        let charIndex = 0;
        let isDeleting = false;
        const typingSpeed = 120;
        const deletingSpeed = 80;
        const holdTime = 5000; // Pause for 5 seconds before backspacing

        function loopTyping() {
            if (!isDeleting) {
                // Forward typing animation
                if (charIndex <= plainText.length) {
                    if (charIndex <= 4) {
                        textTarget.innerHTML = plainText.substring(0, charIndex);
                    } else {
                        textTarget.innerHTML = 'Zero<span>' + plainText.substring(4, charIndex) + '</span>';
                    }
                    charIndex++;
                    setTimeout(loopTyping, typingSpeed);
                } else {
                    // Fully typed out, pause for 5 seconds then switch to deleting state
                    isDeleting = true;
                    setTimeout(loopTyping, holdTime);
                }
            } else {
                // Backward backspace animation
                if (charIndex >= 0) {
                    if (charIndex <= 4) {
                        textTarget.innerHTML = plainText.substring(0, charIndex);
                    } else {
                        textTarget.innerHTML = 'Zero<span>' + plainText.substring(4, charIndex) + '</span>';
                    }
                    charIndex--;
                    setTimeout(loopTyping, deletingSpeed);
                } else {
                    // Fully backspaced, reset states and restart typing loop
                    isDeleting = false;
                    charIndex = 0;
                    setTimeout(loopTyping, 400);
                }
            }
        }

        // Start loop on load
        setTimeout(loopTyping, 600);
    </script>
</body>
</html>
